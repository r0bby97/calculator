<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
  </head>
  <body>
    <div class="calculator">
      <div class="display"></div>
      <div class="numblock">
        <div class="leftblock">
          <div class="specialFunction">
            <button id="delete" class="light-grey">del</button>
            <button id="ac" class="light-grey">ac</button>
            <button id="percent" class="light-grey">%</button>
          </div>
          <div class="numbers">
            <button id="seven" class="dark-grey">7</button>
            <button id="eight" class="dark-grey">8</button>
            <button id="nine" class="dark-grey">9</button>
            <button id="four" class="dark-grey">4</button>
            <button id="five" class="dark-grey">5</button>
            <button id="six" class="dark-grey">6</button>
            <button id="one" class="dark-grey">1</button>
            <button id="two" class="dark-grey">2</button>
            <button id="three" class="dark-grey">3</button>
            <button id="positivNegativ" class="dark-grey">+/-</button>
            <button id="zero" class="dark-grey">0</button>
            <button id="dot" class="dark-grey">.</button>

          </div>
        </div>
        <div class="operator">
            <button id="divid" class="orange">/</button>
            <button id="multiply" class="orange">*</button>
            <button id="subtract" class="orange">-</button>
            <button id="add" class="orange">+</button>
            <button id="equals" class="orange">=</button>
        </div>
        
      </div>
    </div>
  </body>
</html>
