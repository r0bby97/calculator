<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <text id="olderRow"></text>
        <text id="activeRow"></text>
      </div>
      <div class="numblock">
        <div class="leftblock">
          <div class="specialFunction">
            <button id="delete" class="light-grey">DEL</button>
            <button id="ac" class="light-grey">AC</button>
            <button id="percent" class="light-grey">%</button>
          </div>
          <div class="numbers">
            <button id="seven" class="num dark-grey" value="7">7</button>
            <button id="eight" class="num dark-grey" value="8">8</button>
            <button id="nine" class="num dark-grey" value="9">9</button>
            <button id="four" class="num dark-grey" value="4">4</button>
            <button id="five" class="num dark-grey" value="5">5</button>
            <button id="six" class="num dark-grey" value="6">6</button>
            <button id="one" class="num dark-grey" value="1">1</button>
            <button id="two" class="num dark-grey" value="2">2</button>
            <button id="three" class="num dark-grey" value="3">3</button>
            <button id="positivNegativ" class="dark-grey" value="±">±</button>
            <button id="zero" class="num dark-grey" value="0">0</button>
            <button id="dot" class="dark-grey" value=".">.</button>
          </div>
        </div>
        <div class="operator">
            <button id="divide" class="orange" value="÷">÷</button>
            <button id="multiply" class="orange" value="×">×</button>
            <button id="subtract" class="orange" value="−">−</button>
            <button id="add" class="orange" value="+">+</button>
            <button id="equals" class="orange" value="=">=</button>
        </div>
        
      </div>
    </div>
  </body>
</html>
